name: release

# 打 tag（v*）即触发：在 Windows/macOS runner 上分别打包，产物汇总到一个 Release。
# 之后本地只要：git tag v1.3.0 && git push origin v1.3.0
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    env:
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements.txt pyinstaller
      - run: python build_win.py
      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: windows-exe
          path: dist/SenseNova用量查询.exe

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: chmod +x build_mac.sh && ./build_mac.sh
      - name: 打包 .app 为 zip
        run: cd dist && zip -r -y "SenseNova用量查询-mac.zip" "SenseNova用量查询.app"
      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: macos-zip
          path: dist/SenseNova用量查询-mac.zip

  release:
    needs: [windows, macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: 创建 Release 并挂载产物
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/windows-exe/SenseNova用量查询.exe
            artifacts/macos-zip/SenseNova用量查询-mac.zip
          generate_release_notes: true
